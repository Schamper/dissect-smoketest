text
lang en_US.UTF-8
keyboard us
timezone Etc/UTC --utc
url --url=https://mirrors.xtom.de/openeuler/openEuler-24.03-LTS-SP3/OS/x86_64/
network --bootproto=dhcp --hostname=dissect-openeuler-24-03
rootpw --plaintext password
firstboot --disable
firewall --enabled --service=ssh
selinux --enforcing
clearpart --all --initlabel
autopart --type=plain --fstype=ext4
reboot

%packages
@^minimal-environment
%end

%post
mkdir -p /etc/dissect-smoketest
cat > /etc/dissect-smoketest/provisioned <<EOF
template=openeuler-24.03
lifecycle=pinned
EOF
%end
