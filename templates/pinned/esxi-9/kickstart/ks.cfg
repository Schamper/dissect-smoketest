# Accept EULA
vmaccepteula

# Set root password
rootpw --iscrypted $6$sZsV1LaiLIuvSRog$PS6JTZF5X1MR9ZayzsJ2F650YP.g3dok1UZ3aPUK.udBZbq.wPMrVvEaBCcf4WeAu3lnBh3.YpTAitJ41afX51

# Install on local disk overwriting any existing VMFS datastore
install --firstdisk --overwritevmfs

# Network configuration
network --bootproto=dhcp

#Reboot after installation completed
reboot

%post --interpreter=busybox --ignorefailure=true
for cfg in /vmfs/volumes/BOOTBANK*/boot.cfg; do
  if grep -q '^kernelopt=' "$cfg"; then
    sed -i '/^kernelopt=/ s|$| timeoutCS=99999|' "$cfg"
  else
    echo 'kernelopt=timeoutCS=99999' >> "$cfg"
  fi
done

# First boot
%firstboot --interpreter=busybox
sleep 10

# Enter maintenance mode
vim-cmd hostsvc/maintenance_mode_enter

# Enable & start remote ESXi Shell (SSH)
vim-cmd hostsvc/enable_ssh
vim-cmd hostsvc/start_ssh

# Enable & start ESXi Shell (TSM)
vim-cmd hostsvc/enable_esx_shell
vim-cmd hostsvc/start_esx_shell

# Force software checksum/TSO offload so QEMU's NIC doesn't drop guest TX packets (e.g. the SSH banner).
esxcli network nic software set -n vmnic0 --ipv4cso 1 --ipv6cso 1 --ipv4tso 1 --ipv6tso 1 --ipv6csoext 1 --ipv6tsoext 1 --sg 1

# Suppress shell warning
esxcli system settings advanced set -o /UserVars/SuppressShellWarning -i 1
esxcli system settings advanced set -o /UserVars/ESXiShellTimeOut -i 1

# Disable IPv6
esxcli network ip set --ipv6-enabled=false

# Set hostname
esxcli system hostname set --host=esxi-9
esxcli system hostname set --fqdn=esxi-9.local

# Disable CEIP
esxcli system settings advanced set -o /UserVars/HostClientCEIPOptIn -i 2

# Allow some firewall rules
esxcli network firewall ruleset set --ruleset-id sshClient --enabled yes
esxcli network firewall ruleset set --ruleset-id ntpClient --enabled yes
esxcli network firewall ruleset set --ruleset-id httpClient --enabled yes

# Write provisioning marker
mkdir -p /etc/dissect-smoketest
cat > /etc/dissect-smoketest/provisioned <<EOF
template=esxi-9
lifecycle=pinned
EOF

# Persist changes
/sbin/auto-backup.sh

# Exit maintenance mode
vim-cmd hostsvc/maintenance_mode_exit
