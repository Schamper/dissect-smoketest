# Debian 13 preseed: separate /home ext4 partition; the late_command adds the
# encrypt feature so fscrypt can be set up post-install. Passphrase "password"

d-i debian-installer/locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string fscrypt
d-i netcfg/get_domain string local
d-i netcfg/hostname string fscrypt

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i passwd/root-login boolean true
d-i passwd/root-password password password
d-i passwd/root-password-again password password
d-i user-setup/allow-password-weak boolean true
d-i passwd/user-fullname string user
d-i passwd/username string user
d-i passwd/user-password password password
d-i passwd/user-password-again password password
d-i user-setup/encrypt-home boolean false

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# Explicit recipe: root, swap, and a dedicated /home on ext4. The 'home'
# predefined recipe is unreliable in unattended mode; expert_recipe is explicit.
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string \
    fscrypt-layout :: \
        3072 3072 3072 ext4 \
            $primary{ } $bootable{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ / } \
        . \
        512 512 512 linux-swap \
            method{ swap } format{ } \
        . \
        1024 1 -1 ext4 \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /home } \
        .
d-i partman-auto/choose_recipe select fscrypt-layout
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect security, updates
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server fscrypt sudo
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

d-i preseed/late_command string \
    HOME_DEV=$(awk '$2=="/target/home"{print $1}' /proc/mounts); \
    umount /target/home; \
    tune2fs -O encrypt "$HOME_DEV"; \
    e2fsck -fy "$HOME_DEV" || true; \
    mount "$HOME_DEV" /target/home; \
    mkdir -p /target/etc/dissect-smoketest; \
    printf 'template=fscrypt\nlifecycle=corpus\n' > /target/etc/dissect-smoketest/provisioned; \
    in-target usermod -aG sudo user; \
    printf 'user ALL=(ALL) NOPASSWD:ALL\n' > /target/etc/sudoers.d/90-user-nopasswd; \
    chmod 440 /target/etc/sudoers.d/90-user-nopasswd

d-i finish-install/reboot_in_progress note
