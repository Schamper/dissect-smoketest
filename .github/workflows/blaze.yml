name: blaze

# Run the smoketests
on:
  schedule:
    - cron: '20 4 * * *'
  pull_request:
    paths:
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/storage.py'
      - 'scripts/matrix.py'
      - '.github/workflows/blaze.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.list.outputs.templates }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
      - id: list
        run: |
          set -euo pipefail
          templates=$(just matrix all)
          echo "templates=$templates" >> "$GITHUB_OUTPUT"
          echo "Discovered templates: $templates"

  test:
    name: ${{ matrix.template }}
    needs: discover
    if: needs.discover.outputs.templates != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.templates) }}
    concurrency:
      group: blaze-${{ matrix.lifecycle }}-${{ matrix.template }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - run: uv sync

      - name: Download latest image
        run: just download ${{ matrix.template }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}

      - name: Run smoketests
        run: just blaze it
